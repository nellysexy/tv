name: Compilar APK

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      # Busca la carpeta del proyecto (donde está gradlew), esté donde esté.
      - name: Localizar proyecto
        id: proj
        run: |
          G=$(find . -name gradlew -not -path "*/node_modules/*" | head -n1)
          echo "dir=$(dirname "$G")" >> "$GITHUB_OUTPUT"

      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - uses: gradle/actions/setup-gradle@v4

      - name: Compilar
        working-directory: ${{ steps.proj.outputs.dir }}
        run: |
          chmod +x gradlew
          ./gradlew --no-daemon assembleRelease

      - uses: actions/upload-artifact@v4
        with:
          name: NexoTV-apk
          path: ${{ steps.proj.outputs.dir }}/app/build/outputs/apk/release/*.apk
